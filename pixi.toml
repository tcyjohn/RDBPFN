[workspace]
name = "RDBPFN"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
numpy = ">=2.2.6,<3"
pandas = ">=2.3.3,<3"
pydantic = "<2"
pyyaml = "*"
scipy = "*"
networkx = "*"
pyarrow = "*"
pip = ">=26.0.1,<27"
polars = ">=1.39.3,<2"
h5py = ">=3.16.0,<4"
typer = ">=0.25.1,<0.26"
wandb = ">=0.26.1,<0.27"
featuretools = ">=1.31.0,<2"
setuptools = ">=82.0.1,<83"
hydra-core = ">=1.3,<2"


[pypi-dependencies]
torch = {version = ">=2.0", index = "https://download.pytorch.org/whl/cu124"}
relbench = { version = ">=1.1.0, <2" }
dbinfer-bench = ">=0.1, <0.2"

[tasks]
# 用法: pixi run peek-parquet <file.parquet> [--head N] [--schema-only] [--json-schema]
# （不要在 task 名后加 `--`，否则多出的 `-- 会传给 Python 导致参数解析失败）
peek-parquet = "python scripts/peek_parquet.py"

