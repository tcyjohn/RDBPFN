defaults:
  - base_train
  - _self_

seed: 0

train:
  datasets:
    - path: pretrain_datasets/hsbm_v2_d2.h5
      weight: 1.0
      sampled_columns: 30
      targets_per_subset: 0
      group_size_for_augment_data: 0

  num_gpus: 2
  num_epochs: 1
  num_steps: 400
  batch_size: 1
  lr: 0.001
  steps_per_eval: 200
  save_every_evals: 4
  load_model_path: checkpoints/RDBPFN_single/model_eval00360.pt
  save_model_path: checkpoints/RDBPFN_hsbm_test/model.pt

model:
  type: base
  embedding_size: 96
  num_attention_heads: 4
  mlp_hidden_size: 192
  num_layers: 6
  num_outputs: 2
  num_category_buckets: 10
  per_column_embeddings: false
  sort_category_embeddings: false
  invariant_noise_encoder: false
  dual_feature_attention: false
  category_as_numeric: false

eval:
  csv_dirs: [datasets/clf, datasets/clf_real, datasets/clf_rel]

wandb:
  enabled: false
  project: RDBPFN
  run_name: RDBPFN_hsbm_test
